name: 清理异常粉丝

on:
  workflow_dispatch:

jobs:
  remove-fans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check secrets present
        run: |
          if [ -z "$sessdata" ]; then
            echo "ERROR: sessdata is empty"
            exit 1
          else
            echo "sessdata is present"
          fi
          if [ -z "$bili_jct" ]; then
            echo "ERROR: bili_jct is empty"
            exit 1
          else
            echo "bili_jct is present"
          fi
          if [ -z "$buvid3" ]; then
            echo "ERROR: buvid3 is empty"
            exit 1
          else
            echo "buvid3 is present"
          fi
          if [ -z "$ac_time_value" ]; then
            echo "ERROR: ac_time_value is empty"
            exit 1
          else
            echo "ac_time_value is present"
          fi
        env:
          sessdata: ${{ secrets.SESSDATA }}
          bili_jct: ${{ secrets.BILI_JCT }}
          buvid3: ${{ secrets.BUVID3 }}
          ac_time_value: ${{ secrets.AC_TIME_VALUE }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run remove_rob_fans
        env:
          sessdata: ${{ secrets.SESSDATA }}
          bili_jct: ${{ secrets.BILI_JCT }}
          buvid3: ${{ secrets.BUVID3 }}
          ac_time_value: ${{ secrets.AC_TIME_VALUE }}
        run: python remove_rob_fans.py
